services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    volumes:
      - triage_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${ECR_BACKEND_URL}:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TRIAGE_MODEL: ${TRIAGE_MODEL}
      CLASSIFY_MODEL: ${CLASSIFY_MODEL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GATEWAY_KEY: ${GATEWAY_KEY}
      DATABASE_URL: ${DATABASE_URL}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    # No host ports: the backend is reached only via the Cloudflare tunnel
    # over the internal docker network (cloudflared -> backend:8000).

  # Outbound-only Cloudflare tunnel. Dials out to Cloudflare's edge, so no
  # inbound ports are opened on the host. Configure the public hostname ->
  # http://backend:8000 mapping in the Cloudflare Zero Trust dashboard.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - backend
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}

volumes:
  triage_pg_data:
